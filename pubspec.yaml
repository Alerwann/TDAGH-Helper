name: tdahelpe
description: "Application qui permet d'aider la gestion du quotidient pour les neurodivergents"

publish_to: "none" 

version: 1.0.0+2

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter

  # UI & Styling :

  convex_bottom_bar: ^3.2.0
  custom_timer: ^0.2.3
  hugeicons_pro: ^0.0.1
  linear_progress_bar: ^1.2.0
  lottie: ^3.3.1
  timer_count_down: ^2.2.0
  step_progress_indicator: ^1.0.2
  loading_animation_widget: ^1.3.0

  # File handling :

  audioplayers: ^6.5.1
  csv: ^6.0.0
  file_picker: ^10.3.3
  image_picker: ^1.2.0
  logging: ^1.3.0


  # system & utilities :

  device_info_plus: ^10.1.0
  flutter_local_notifications: ^19.5.0
  path_provider: ^2.1.5
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  timezone: ^0.10.1
  app_settings: ^5.1.1 
  url_launcher: ^6.3.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  dependency_validator: ^5.0.2
  mockito: ^5.4.4
  build_runner: ^2.4.8


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/bingo_images/
    - assets/animations/
    - assets/music/
    - assets/data/level_bonus.csv
  
 

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon_TDAHelp.png"
  remove_alpha_ios: true  
